<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zaika Ghaziabad – Food delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><link rel="stylesheet" href="style.css"></head>
<body data-p="home"><main class="home"><section class="hl"><span class="pill" id="pl"></span>
<h1>Hungry in Ghaziabad? Drop a pin, dinner's on its way.</h1><p>Search your address, tap the map or drag the pin. We'll show you what's closest.</p>
<div class="sbox"><input id="addr" placeholder="Search your area or address" aria-label="Delivery address"><button id="find" class="primary"></button></div>
<div class="row0"><button id="geo" class="ghost"></button><span id="near" class="near"></span></div><div id="chips" class="chips"></div>
<button id="go" class="primary big">Confirm location &amp; find food</button><div id="tr" class="trust"></div></section>
<section class="mapwrap"><div id="map"></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script src="data.js"></script><script src="app.js"></script></body></html>
